# ===================================================
# Group Expense Splitter - Spring Boot Configuration
# ===================================================

server.port=8080
spring.application.name=group-expense-splitter

# ===================================================
# Database Configuration (MySQL)
# Set these environment variables before starting:
#   DB_URL      e.g. jdbc:mysql://localhost:3306/group_expense_splitter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   DB_USERNAME e.g. root
#   DB_PASSWORD e.g. yourpassword
# ===================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/group_expense_splitter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / Hibernate Configuration
# ===================================================
# 'update' = safe for development; creates/alters tables without dropping data.
# Switch to 'validate' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================
# Logging
# ===================================================
logging.level.com.groupexpensesplitter=DEBUG
logging.level.org.springframework.web=INFO

# ===================================================
# Max Request Size (for receipt/screenshot uploads)
# ===================================================
server.tomcat.max-http-form-post-size=15MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
